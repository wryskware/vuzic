[project]
name = "terrarium-analysis"
version = "0.1.0"
description = "Offline music analysis pipeline for the Latent Music Terrarium (timeline.json + timeline.bin, format v2)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10.1",
    "soundfile>=0.12",
    "matplotlib>=3.7",
]

# Heavy extras are NEVER installed by default and are never imported at module
# scope. They are listed here as documentation of the exact install commands the
# lazy-import error messages quote back to the user.
[project.optional-dependencies]
dev = ["pytest>=8"]
beats = ["beat-this>=1.1.0"]
# `all-in-one-infer` is the renamed, maintained `all-in-one-fix`: pure-PyTorch
# neighborhood attention (no NATTEN build), madmom-infer, demucs-infer.
structure = ["all-in-one-infer>=3.1.0"]
character = ["muq>=0.1.0", "torch>=2.1"]

[project.scripts]
terrarium-analyze = "terrarium_analysis.cli:main"
terrarium-plot = "terrarium_analysis.plot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terrarium_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
